<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Case Tracking Lite</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container mt-4">

    <h1 class="mb-4">Case List</h1>

    <div class="mb-3">
        <button class="btn btn-primary" onclick="showAddForm()">
            + Yeni Case
        </button>
    </div>

    <div class="row mb-3">
        <div class="col-md-4">
            <input
                type="text"
                id="searchInput"
                class="form-control"
                placeholder="Ara..."
                onkeyup="filterCases()">
        </div>
    </div>

    <table class="table table-bordered table-striped">
        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Description</th>
                <th>Status</th>
                <th>Assigned</th>
                <th>Date</th>
                <th width="190">Action</th>
            </tr>
        </thead>

        <tbody id="caseTableBody">

        </tbody>
    </table>

</div>

<!-- Modal -->

<div class="modal fade" id="caseModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Case</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">

                <input type="hidden" id="caseId">

                <div class="mb-3">
                    <label class="form-label">Title</label>
                    <input type="text" id="title" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea id="description" class="form-control" rows="4"></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Status</label>

                    <select id="status" class="form-select">
                        <option value="Open">Open</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Waiting IT">Waiting IT</option>
                        <option value="Completed">Completed</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Assigned To</label>
                    <input type="text" id="assigned" class="form-control">
                </div>

            </div>

            <div class="modal-footer">

                <button class="btn btn-success" onclick="saveCase()">
                    Kaydet
                </button>

                <button class="btn btn-secondary" data-bs-dismiss="modal">
                    Kapat
                </button>

            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="app.js"></script>

</body>
</html>
